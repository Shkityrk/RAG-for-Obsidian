name: Deploy to server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_APP_URL: ${{ secrets.DEPLOY_APP_URL }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH DEPLOY_APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/ui/package-lock.json

      - name: Build frontend (CI)
        working-directory: client/ui
        env:
          VITE_APPLICATION_MODE: prod
          VITE_API_BASE_URL: ${{ secrets.DEPLOY_APP_URL }}
        run: npm ci && npm run build

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "client/ui/dist"
          target: ${{ secrets.DEPLOY_PATH }}/client/ui
          overwrite: true
          rm: true

      - name: Verify frontend dist on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            test -f "${DEPLOY_PATH}/client/ui/dist/index.html"
            echo "OK: dist/index.html exists on server"

      - name: Deploy backend services
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export DEPLOY_APP_URL="${{ secrets.DEPLOY_APP_URL }}"
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            export SKIP_UI_BUILD="true"
            bash "${DEPLOY_PATH}/scripts/deploy-remote.sh"
